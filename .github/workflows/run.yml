on:
  schedule:
    - cron: '5 12 * * 3' # 12:05 UTC, Weekly on a Wednesday

  workflow_dispatch:
    inputs:
      post_to_slack:
        description: 'Post notifications to Slack'
        type: boolean
        default: false

jobs:
  daniel_the_manual_spaniel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
      - run: bundle exec rake notify:expired
        env:
          REALLY_POST_TO_SLACK: ${{ (github.event_name == 'schedule' || inputs.post_to_slack) && 1 || 0 }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}